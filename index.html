<script type="module">
import * as THREE from 'three';

/* =========================================================
   설정 (프로토타입 조절용)
   ========================================================= */
const AFTER_HOST=2; // 연구장 고스트가 멈춘 뒤 참가자에게 남는 시간(초)
const MISSION=['<b>꾹</b> 눌러 먹기 — 떼면 멈춰요','<b>톡톡</b> 끊어 먹다가 중간에 <b>측정 완료</b>','자유 측정 — 친구를 속일 <b>함정</b>을 만들어 보세요'];
const HOST_TIME=10; // 연구장 측정 제한 시간(초). 참가자는 roundTime(15초)
const DEFAULTS = { L:140, halfTime:3, inertia:0.3, perfect:2, chicken:30, hostMinLeft:10, roundTime:15, view:20, sound:'clear', shake:true };
let CFG = { ...DEFAULTS };
const CRUNCH_MM = 2.4;          // 몇 mm마다 '바삭' 한 번
const HOST_AUTO_START = 8;      // 방장이 이 시간까지 안 누르면 자동 처리
const CH_DEADLINE = 15;         // 도전자 제한 시간(누르기 시작 전)

const $ = s => document.querySelector(s);
const app = $('#app');

/* =========================================================
   먹기 계산 (해석적 — 프레임과 무관하게 정확)
   ========================================================= */
const speed = p => (p.L/2)/p.halfTime; // mm/s
// segs: [{tp,tr}] — 여러 번 누르기 지원 (관성 꼬리는 다음 누르기에서 끊김)
function eatenAt(t, segs, p){
  const V=speed(p), I=p.inertia; let e=0;
  for(let i=0;i<segs.length;i++){ const s=segs[i]; if(t<=s.tp) break;
    if(s.mm!=null){ e+=s.mm*Math.min(1,(t-s.tp)/(s.tr-s.tp)); continue; }
    const tr=s.tr==null?Infinity:s.tr; e+=V*(Math.min(t,tr)-s.tp);
    if(t>tr && I>0){ const next=segs[i+1]?segs[i+1].tp:Infinity; const dt=Math.min(t,next,tr+I)-tr; if(dt>0) e+=V*(dt-dt*dt/(2*I)); } }
  return e;
}
function rateAt(t, segs, p){
  const V=speed(p), I=p.inertia;
  for(let i=segs.length-1;i>=0;i--){ const s=segs[i]; if(t<s.tp) continue;
    if(s.mm!=null) return t<s.tr?s.mm/(s.tr-s.tp):0;
    if(s.tr==null||t<=s.tr) return V; const dt=t-s.tr; return (I>0&&dt<I)?V*(1-dt/I):0; }
  return 0;
}
const endOf=(segs,p)=>{ const l=segs[segs.length-1]; return l?l.tr+(l.mm!=null?0:p.inertia):0; };
const nudgeDur=mm=>mm>=3?.2:mm>=.5?.1:.05;   // 한 입 먹는 시간
const NUDGE_GAP=.05;                               // 다음 입까지 간격
const JIT={5:.045,1:.09,0.1:.18,0.01:.3};                   // 한 입 양 흔들림(±비율)
const finalEaten=(segs,p)=>eatenAt(1e9,segs,p);

/* =========================================================
   오디오 (전부 합성음)
   ========================================================= */
const AC = { ctx:null, master:null, noise:null, hum:null };
function muteOf(k){ const o=store.get('pp_mute',0); return !!store.get('pp_mute_'+k,o); }
function initAudio(){
  if(AC.ctx){ if(AC.ctx.state!=='running') AC.ctx.resume(); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
  const ctx = AC.ctx = new Ctx();
  AC.master = ctx.createGain(); AC.master.gain.value=muteOf('sfx')?0:.9; AC.master.connect(ctx.destination); // 효과음
  AC.music = ctx.createGain(); AC.music.gain.value=muteOf('bgm')?0:1; AC.music.connect(ctx.destination); // 배경음
  const len = ctx.sampleRate; const buf = ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  AC.noise = buf;
  startBgm();
}
// 배경음: 로비 = 느긋한 마림바 + 비커 보글 / 측정 중 = 째깍째깍 긴장 피치카토
function startBgm(){
  const ctx=AC.ctx;
  const mk=v=>{ const g=ctx.createGain(); g.gain.value=v; g.connect(AC.music); return g; };
  const lob=mk(.16), gam=mk(0); AC.bgm=lob;
  const N=m=>440*Math.pow(2,(m-69)/12);
  function mar(bus,t,f,v,d){ [[1,v],[4,v*.18]].forEach(([k,vv])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*k;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vv,t+.006); g.gain.exponentialRampToValueAtTime(.0005,t+(k>1?.12:d));
    o.connect(g).connect(bus); o.start(t); o.stop(t+d+.05); }); }
  function blup(t){ const o=ctx.createOscillator(); o.type='sine'; const f=280+Math.random()*200;
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.6,t+.07);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+.09);
    o.connect(g).connect(lob); o.start(t); o.stop(t+.12); }
  function pizz(t,f,v){ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0005,t+.16);
    o.connect(lp).connect(g).connect(gam); o.start(t); o.stop(t+.2); }
  function tick(t,v){ noiseHit(t,{freq:6500,q:3,dur:.025,vol:v,type:'bandpass',dest:gam}); }
  // 로비
  const prog=[[48,[60,64,67,71,74]],[45,[57,60,64,67,72]],[41,[57,60,65,69,72]],[43,[55,59,62,67,71]]];
  const ls=60/92/2; let ln=ctx.currentTime+.1, li=0;
  // 측정 중 (A단조, 빠른 16분)
  const gprog=[[45,[69,72,76,79]],[45,[69,72,76,81]],[41,[69,72,77,81]],[44,[68,71,76,80]]];
  const gs=60/124/4; let gn=ctx.currentTime+.1, gi=0;
  let mode='lobby';
  const fade=(g,v)=>{ const t=ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(v,t+.6); };
  setInterval(()=>{
    const ph=S.phase, want=/Count$|Play$/.test(ph)?'game':ph==='reveal'?'none':'lobby';
    if(want!==mode){ mode=want; fade(lob,want==='lobby'?.16:0); fade(gam,want==='game'?.14:0); if(want==='game'){ gi=0; gn=ctx.currentTime+.05; } }
    const now=ctx.currentTime;
    if(ln<now) ln=now+.05;
    while(ln<now+.3){
      const bar=Math.floor(li/8)%4, beat=li%8, [bass,sc]=prog[bar];
      if(mode==='lobby'){
        if(beat===0) mar(lob,ln,N(bass),.5,1.4);
        if(beat===4) mar(lob,ln,N(bass+7),.3,.9);
        if(Math.random()<[1,0,.5,.6,0,.7,.4,.3][beat]) mar(lob,ln,N(sc[Math.floor(Math.random()*sc.length)]),.22+Math.random()*.1,.6);
        if(Math.random()<.03) blup(ln+ls*.5);
      }
      ln+=ls; li++;
    }
    if(gn<now) gn=now+.05;
    while(gn<now+.3){
      const bar=Math.floor(gi/16)%4, st=gi%16, [bass,sc]=gprog[bar];
      if(mode==='game'){
        tick(gn, st%4===0?.32:.12);
        if(st%4===0||st===14) pizz(gn,N(bass-12+(st===8?7:0)),.55);
        if(st%2===0 && Math.random()<.45) pizz(gn,N(sc[Math.floor(Math.random()*sc.length)]),.2);
      }
      gn+=gs; gi++;
    }
  },100);
}
function out(pan){
  const ctx=AC.ctx;
  if(ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=pan||0; p.connect(AC.master); return p; }
  return AC.master;
}
function noiseHit(t, {freq=3000,q=1,dur=.05,vol=.5,type='bandpass',dest}={}){
  const ctx=AC.ctx; const s=ctx.createBufferSource(); s.buffer=AC.noise;
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.003); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f).connect(g).connect(dest||AC.master); s.start(t, Math.random()*.8, dur+.05);
}
function tone(t,{f=880,f2=null,dur=.12,type='square',vol=.12,dest}={}){
  const ctx=AC.ctx; const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(dest||AC.master); o.start(t); o.stop(t+dur+.05);
}
function blush(c,k){ c.furM.emissive.setRGB(.95*k,.12*k,.25*k); c.cheekM.color.set(k>.05?'#ff3d6e':'#ffb3c6'); c.cheeks.forEach(m=>m.scale.set(1+k*.7,.6+k*.5,.4)); }
function kissSfx(){ if(!AC.ctx) return; const ctx=AC.ctx, t=ctx.currentTime;
  // "음~~" : 콧소리 허밍
  const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(150,t); o.frequency.linearRampToValueAtTime(205,t+.55); o.frequency.linearRampToValueAtTime(175,t+.95);

  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(4+Math.random()*9)*W/400;
    parts.push({x:W/2,y:H*.42,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6*W/400,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:(6+Math.random()*7)*W/400,h:(3+Math.random()*4)*W/400,c:cols[i%cols.length],life:1}); } }

function labObj(lab){
  return {v:1,id:lab.id,n:lab.n,m:lab.m,c:Math.round(lab.c/1000),R:lab.runs.map(sg=>({s:sg.filter(x=>x.mm==null).flatMap(x=>[Math.round(x.tp*1000),Math.round(x.tr*1000)]),nd:sg.filter(x=>x.mm!=null).flatMap(x=>[Math.round(x.tp*1000),x.mm])})),rt:lab.p.roundTime,vw:lab.p.view,
    L:lab.p.L,ht:Math.round(lab.p.halfTime*100),in:Math.round(lab.p.inertia*1000),ml:lab.p.hostMinLeft,pf:Math.round(lab.p.perfect*10),ck:lab.p.chicken,lk:[lab.look.sp,lab.look.fur,lab.look.gog,lab.look.acc]};
}
function encodeLab(lab){
  const b=new TextEncoder().encode(JSON.stringify(labObj(lab)));
  return 'lab-'+Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
}
function decodeLab(h){
  if(!h||!h.startsWith('lab-')) return null;
  try{ const hex=h.slice(4); if(!/^[0-9a-f]+$/.test(hex)||hex.length%2) return null;
    return labFromObj(JSON.parse(new TextDecoder().decode(new Uint8Array(hex.match(/../g).map(x=>parseInt(x,16))))));
  }catch(e){ return null; }
}
function labFromObj(o){
  { const lk=o.lk||[0,0,0,0];
    return {id:o.id,n:o.n,m:o.m,c:o.c*1000,look:{sp:lk[0],fur:lk[1],gog:lk[2],acc:lk[3]},
      runs:(o.R||[o]).map(o=>[...(o.s?Array.from({length:o.s.length/2},(_,i)=>({tp:o.s[2*i]/1000,tr:o.s[2*i+1]/1000})):(o.tp!=null&&o.tp!==o.tr?[{tp:o.tp/1000,tr:o.tr/1000}]:[])),
        ...(o.nd?Array.from({length:o.nd.length/2},(_,i)=>{ const tp=o.nd[2*i]/1000, mm=o.nd[2*i+1]; return {tp,tr:tp+nudgeDur(mm),mm}; }):[])].sort((a,b)=>a.tp-b.tp)),
      p:{...DEFAULTS,L:o.L,halfTime:o.ht/100,inertia:o.in/1000,hostMinLeft:o.ml,perfect:o.pf/10,chicken:o.ck,roundTime:o.rt||DEFAULTS.roundTime,view:o.vw||DEFAULTS.view}};
  }
}

async function migrateLab(lab){
  if(!lab||lab.db||!isOwner(lab.id)||!DB.on) return lab;
  const oldId=lab.id;
  try{ const copy={...lab}; if(!/^[A-Z0-9]{4,8}$/.test(copy.id)) copy.id=newId(); await DB.createLab(copy);
    const owned=store.get('pp_owned',[]); if(!owned.includes(copy.id)){ owned.push(copy.id); store.set('pp_owned',owned); }
    const mine=store.get('pp_mylabs',[]).filter(x=>x.id!==oldId&&x.id!==copy.id); mine.push({id:copy.id,h:labHash(copy)}); store.set('pp_mylabs',mine.slice(-10));
    try{ history.replaceState(null,'',labHash(copy)); }catch(e){}
    setTimeout(()=>toast('연구실을 서버로 옮겼어요 — 새 참가 링크를 보내 주세요',2800),900);
    return copy;
  }catch(e){ console.warn('[DB] 이전 실패',e); return lab; }
}

  try{ return await DB.loadLab(m[1]); }catch(e){ console.warn(e); return null; }
}

function runDialog(lines,who,talker){
  return new Promise(res=>{
    const box=$('#dlg'), txt=box.querySelector('.txt'), ex=box.querySelector('.extra'); box.querySelector('.who').textContent=who; box.style.display='block';
    let i=0, typing=null, full='';
    box.style.minHeight='';
    if(lines.some(L=>L.x)){ const tx=box.querySelector('.txt'), xx=box.querySelector('.extra'); box.style.visibility='hidden'; let mh=0;
      for(const L of lines){ tx.innerHTML=L.t; xx.innerHTML=(L.x&&!L.x.includes('tphoto'))?L.x:''; mh=Math.max(mh,box.offsetHeight); }
      tx.innerHTML=''; xx.innerHTML=''; box.style.visibility=''; box.style.minHeight=mh+'px'; }
    const finishType=()=>{ if(typing){ clearInterval(typing); typing=null; } txt.innerHTML=full; if(talker) talker.chew=0; };
    const isPh=L=>!!(L.x&&L.x.includes('tphoto'));
    const show=()=>{ const L=lines[i]; pointAt(L.pt||null); { const ph=box.querySelector('.dph'); ph.innerHTML=isPh(L)?L.x:''; ph.classList.toggle('wide',isPh(L)&&L.x.includes('tphoto wide')); } document.body.classList.add('dlgOn'); document.body.classList.toggle('ptrOn',!!L.pt); full=L.t; ex.innerHTML=isPh(L)?'':(L.x||''); txt.innerHTML=''; let k=0; if(talker) talker.chew=1;
      const plain=full.replace(/<[^>]+>/g,'');
      typing=setInterval(()=>{ k++; // 태그 단위로 잘리지 않게: 보이는 글자 수만큼 원문을 잘라 냄
        let n=0, out=''; for(let j=0;j<full.length;j++){ if(full[j]==='<'){ const e=full.indexOf('>',j); out+=full.slice(j,e+1); j=e; continue; } if(n>=k) break; out+=full[j]; n++; }
        txt.innerHTML=out; if(k%2===0) sfx.beep(900+Math.random()*250,.025,.03);
        if(k>=plain.length) finishType(); },26); };
    const next=()=>{ initAudio(); if(typing){ finishType(); return; } i++; if(i>=lines.length){ end(); return; } show(); };
    const end=()=>{ finishType(); box.style.minHeight=''; box.querySelector('.dph').innerHTML=''; pointAt(null); document.body.classList.remove('dlgOn','ptrOn'); box.style.display='none'; box.onclick=null; box.querySelector('.skip').onclick=null; res(); };
    box.onclick=e=>{ if(e.target.classList.contains('skip')) return; next(); };
    box.querySelector('.skip').onclick=e=>{ e.stopPropagation(); end(); };
    show();
  });

async function ownerTutorial(name,replay){
  if(replay){ FLOW++; S.phase='tutorial'; setLobby(false); resetVisuals(); const lk=(S.lab&&S.lab.look)||store.get('pp_look',null)||DEF_LOOK; rebuildChar('L',lk); charR.root.visible=false; charL.root.position.x=baseL; setLabels(name+' 연구장','연구원'); }
  hidePanel(); const c=createCam(); await zoomTo(c.T.clone(),c.D,600,c.dir);
  await runDialog([
    {t:`어서 오게! 여기는 <b>초정밀 빼빼로 길이 측정 연구소</b>일세.`},
    {t:`우리 연구소는 매년 11월 11일, 인류의 오랜 난제를 연구하지.\n<b>빼빼로 양끝을 둘이 먹을 때, 닿지 않고 얼마나 가까이 갈 수 있는가!</b>`},
    {t:`측정은 우리 연구소의 <b>레이저 측정기 PPR-1111</b>이 맡네.\n남은 빼빼로 길이를 <b>0.001mm 단위</b>까지 잰다네.`,x:PHOTO('laser','측정 확대 · 레이저 PPR-1111')},
    {t:`그리고 오늘부터 자네가 이 연구실의 <b>연구장</b>일세.\n먼저 빼빼로를 먹어서 실험 기록을 남겨 주게.`},
    {t:`기록은 <b>3번</b> 남기게.\n친구가 참가하면 그중 하나가 무작위로 재생된다네.`},
    {t:`자네의 기록이 친구의 <b>상대</b>가 되네.\n많이 먹을수록 친구는 부딪히기 쉽고, 적게 먹으면 친구가 멀리 와야 하지.`,x:PHOTO('scene','실험 장면')},
    {t:`빠르게 쭉 가다 뚝 멈추기, 조금씩 멈췄다 가기…\n친구가 예측하기 어렵게 <b>함정</b>을 만들어 보게.`},
    {t:`다 끝나면 <b>참가 링크</b>를 친구에게 보내게.\n0.00mm에 가장 가까이 온 연구원은 <b>수석</b>이 된다네.`,x:MOCK_TIERS},
    replay?{t:`설명은 여기까지! 궁금하면 언제든 <b>설정</b>에서 다시 불러 주게.`}:{t:`그럼, 첫 번째 측정을 시작해 볼까?`}
  ],'연구소장',null);
  store.set('pp_tut',1);
  if(replay){ charR.root.visible=true; if(S.lab){ S.viewAs=isOwner(S.lab.id)?'owner':S.viewAs; await showLab(); } else showCreate(); }
}

function stepCh(t){
  const p=S.hostP, pc=S.chP, hostEnd=endOf(S.host.segs,p), RT=(hostEnd>0&&isFinite(hostEnd))?Math.min(pc.roundTime,hostEnd+AFTER_HOST):pc.roundTime;
  if(!S.ch.ended && !S.hostStopT && t>=hostEnd && RT<pc.roundTime){ S.hostStopT=1; coach(`연구장이 멈췄어요! <b>${AFTER_HOST}초</b> 남았어요`,AFTER_HOST*1000,'warn top'); glow('#timer',AFTER_HOST*1000); }
  if(!S.ch.ended && t>=RT){ endRound(S.ch); toast('⏱ 실험 시간 종료'); }
  const h=eatenAt(t,S.host.segs,p), c=eatenAt(t,S.ch.segs,pc);
  if(!S.collided && h+c>=p.L){ S.collided=true; closeSeg(S.ch,t); S.ch.ended=true; hideEndBtn(); finish(h,Math.max(0,p.L-h)); return; }
  timeHud(t,RT); eatHud(c); syncPress(S.ch,t,pc);
  for(const g of S.host.segs) if(g.mm!=null && g.tp>(S.lastT??-1) && g.tp<=t){ ghostCrunch(); spawnCrumbs(-HALF+h/10,1,g.mm>=3?4:g.mm>=.5?2:1,g.mm>=.5?1:.6); }
  S.lastT=t;
  track('host',h,()=>{ ghostCrunch(); spawnCrumbs(-HALF+h/10,1,3); }); track('ch',c,()=>{ sfx.crunch({pan:.6,pitch:1.15,vol:.5}); spawnCrumbs(HALF-c/10,-1,4); });
  updateStick(h,c); charL.root.position.x=baseL+h/10; charR.root.position.x=baseR-c/10;
  charL.chew=rateAt(t,S.host.segs,p)>0?1:0; charR.chew=rateAt(t,S.ch.segs,pc)>0?1:0;
  const chEnd=S.ch.ended?(S.ch.segs.length?Math.max(endOf(S.ch.segs,pc),0):0):Infinity;
  if(S.ch.ended && t>=Math.max(hostEnd,chEnd)+.4) finish();
}

function finish(hCol,cCol){
  coachOff(); if(S.hint&&S.hint.mode==='ch') store.set('pp_hint_c',1); S.hint=null;
  S.phase='reveal'; showPress(false); hideEndBtn(); hideHud(); charL.sweatLv=charR.sweatLv=0; charL.chew=charR.chew=0; S.close=null;
  const p=S.hostP, pc=S.chP; let hF,cF,gap;
  if(S.collided){ hF=hCol; cF=cCol; gap=0; }
  else { hF=finalEaten(S.host.segs,p); cF=finalEaten(S.ch.segs,pc); gap=p.L-hF-cF;
    if(gap<=0){ S.collided=true; gap=0; cF=p.L-hF; } }
  const tier=S.collided?'crash':gap<=LEGEND_MM?'legend':gap<=pc.perfect?'perfect':gap<=CLOSE_MM?'close':gap<=NORMAL_MM?'normal':gap<pc.chicken?'timid':'chicken';
  reveal({hF,cF,gap,tier});
}

  if(S.phase==='chPlay'&&S.close){ const t=(now-S.t0)/1000, gap=S.chP.L-eatenAt(t,S.host.segs,S.hostP)-eatenAt(t,S.ch.segs,S.chP), vw=Math.max(S.chP.view,4);
    const tw=gap<vw*.45?Math.max(1.2,gap*2.6):vw; S.zw=(S.zw||vw)+(tw-(S.zw||vw))*Math.min(1,dt*2.2); }   // 가까워질수록 서서히 확대
  if(S.close && (S.phase==='hostPlay'||S.phase==='chPlay')){ const v=closeView(); camT.lerp(v.T,Math.min(1,dt*8)); camD=v.D; camDir.copy(v.dir); applyCam(); }
  camKickV*=Math.pow(.01,dt); if(camKickV>.01 && S.close){ camera.position.x+=Math.sin(time*90)*camD*.004*camKickV; camera.position.y+=Math.cos(time*77)*camD*.003*camKickV; }
  // 캐릭터 애니메이션
  blink(charL,dt); blink(charR,dt);
  for(const ch of [charL,charR]){
    const chewing=ch.chew>0;
    ch.head.position.y=(ch.head.userData.baseY??7.9)+(chewing?Math.abs(Math.sin(time*24))*.13:Math.sin(time*1.6+ch.facing)*.04);
    ch.snout.scale.y=.75*(chewing?1+Math.sin(time*48)*.07:1);
    if(!S.kissing) ch.head.rotation.z=(S.phase==='chPlay'&&ch===charL)?Math.sin(time*1.3)*.05:Math.sin(time*.9+ch.facing)*.02;
    const lv=ch.sweatLv||0; if(lv>.03&&!ch.sweatForce) ch.sweat.visible=true; else if(!ch.sweatForce) ch.sweat.visible=false;
    if(ch.sweat.visible){ const L=ch.sweatForce?1:lv, n=Math.max(1,Math.ceil(L*6)); ch.sweat.children.forEach((d,i)=>{ d.visible=i<n; const k=((time*(.7+L*1.6)+d.userData.ph)%1); d.position.y=d.userData.y0-k*1.4; d.scale.setScalar((.45+L*.45)*(1-k*.5)); }); }
  }
  if(S.phase==='hostPlay'||S.phase==='chPlay'){ const r=curRec();
    if(!r||r.ended||r.locked) S.pend=null;
    else if(nowT()>=(r.busy||0)){ if(S.pend!=null){ const m=S.pend; S.pend=null; nudge(m,true); } else if(S.repeat) nudge(S.repeat.mm,true); } }
  else S.pend=null;
  ruler.visible=!!S.close; if(lobby.visible) stepAvatars(dt,time); stepCrumbs(dt);
  updateRadar(time);
  // 블라인드 흔들림
  blindKickV*=Math.pow(.02,dt); blind.position.x=BX+Math.sin(time*70)*.09*blindKickV; blind.rotation.z=Math.sin(time*53)*.006*blindKickV;
  // 사이렌 조명 & 측정기 LED
  sirenLight.intensity=S.sirenOn?(Math.sin(time*14)*.5+.5)*900:0;
  devLed.material.color.set(Math.sin(time*6)>0?'#ff2b4a':'#5c1a24');
  hand2.rotation.z=-time*.5;
  if(S.phase==='town'){ stepTown(dt,time); renderer.render(townScene,camera); } else renderer.render(scene,camera);
  if(parts.length) stepFx(); else if(fxC._dirty!==false){ fxG.clearRect(0,0,fxC.width,fxC.height); fxC._dirty=false; }
  if(parts.length) fxC._dirty=true;
}

addEventListener('resize',resize);
document.addEventListener('focusin',()=>{ if(document.body.classList.contains('kb')) setTimeout(resize,60); });
resize(); setCamDefault(); buildSettings();
document.fonts?.ready.then(()=>texs.forEach(t=>t.redraw()));
setTimeout(()=>texs.forEach(t=>t.redraw()),1500);
requestAnimationFrame(loop);
showTitle();

</script>
