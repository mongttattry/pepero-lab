<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>초정밀 빼빼로 길이 측정 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--mint:#7fd1c1;--mint-d:#3f9f8e;--ink:#24343a;--pink:#ff8fab;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#cfe6e0;overflow:hidden;font-family:'Jua',system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#app{word-break:keep-all;overflow-wrap:anywhere;position:relative;overflow:hidden;background:#eef6f4;box-shadow:0 0 40px rgba(36,52,58,.18)}
#stage{position:absolute;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter .6s}
#app.cold #c{filter:grayscale(.75) brightness(.92) contrast(1.05)}
#cold{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#5b7fa333,#2c3e5055);opacity:0;transition:opacity .6s}
#app.cold #cold{opacity:1}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#ff2b4a00 30%,#ff2b4acc 100%);opacity:0}
#flash.on{animation:siren .45s ease-in-out infinite alternate}
@keyframes siren{from{opacity:.15}to{opacity:.95}}
.glass{background:rgba(255,255,255,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.85);border-radius:1.1em;box-shadow:0 .5em 1.8em rgba(36,52,58,.12)}
#hud{position:absolute;top:.8em;left:.8em;right:.8em;display:flex;justify-content:space-between;align-items:flex-start;gap:.5em;pointer-events:none;z-index:5}
#role{padding:.4em .8em;font-size:.95em;display:flex;align-items:center;gap:.4em;white-space:nowrap;min-width:0;max-width:calc(100% - 3em)}
#roleTxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
#role .dot{flex:none}
#hudR{flex:none}
#role .dot{width:.6em;height:.6em;border-radius:50%;background:var(--mint);box-shadow:0 0 0 .2em #7fd1c144}
#hudR{display:flex;gap:.4em;align-items:center;position:relative}
#hudR #timer{position:absolute;right:100%;margin-right:.4em;white-space:nowrap}
#timer{font-family:'Share Tech Mono',monospace;padding:.4em .7em;font-size:1.05em;min-width:6.4em;text-align:center;visibility:hidden}
#timer.urgent{color:#e03131;animation:blink .5s steps(2) infinite}
#gear{pointer-events:auto;width:2.3em;height:2.3em;font-size:1em;border:none;cursor:pointer;color:var(--ink)}
#eat{position:absolute;left:50%;bottom:19.5%;transform:translateX(-50%);padding:.3em .9em;font-size:.9em;display:none;z-index:6;white-space:nowrap}
#eat b{font-family:'Share Tech Mono',monospace;font-size:1.25em;font-weight:400;color:#c2255c}
#nudges{position:absolute;left:4%;right:4%;bottom:4.5%;display:none;gap:.5em;z-index:7}
#nudges button{flex:1;font-family:'Jua',sans-serif;border:.16em solid #b9dcd4;cursor:pointer;color:var(--ink);padding:1.65em .2em 1.55em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;touch-action:none;border-radius:1.1em;transition:transform .08s,background .15s}
#nudges button.on{transform:scale(.94);background:linear-gradient(180deg,#ffe3ec,#ffc9d9);border-color:var(--pink)}
#nudges i{font-style:normal;font-size:.62em;opacity:.55;margin-top:.2em}
#nudges b{font-weight:400;font-size:1.3em}
#nudges span{font-family:'Share Tech Mono',monospace;font-size:1em;color:#c2255c}
#nudges button.hit{animation:hit .2s ease-out}
@keyframes hit{0%{transform:scale(.86)}100%{transform:scale(1)}}
#endBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:23.5%;padding:.55em 1.5em;font-family:'Jua',sans-serif;font-size:1.05em;border:none;cursor:pointer;color:#fff;display:none;z-index:7;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,#5fc4b1,#3f9f8e) !important;box-shadow:0 .25em 0 #2f7d70,0 0 0 1.2pt #21685c,0 .25em 0 1.2pt #21685c,0 .5em 1em rgba(63,159,142,.3);animation:endGlow 1.6s ease-in-out infinite}
#endBtn.off{background:#8a9a98 !important;color:#e8eeed;box-shadow:0 .2em 0 #5f6d6b !important;animation:none;pointer-events:none;filter:saturate(.3)}
#nudges.off button{opacity:.45;filter:grayscale(.8);pointer-events:none}
#endBtn:active{transform:translateX(-50%) translateY(.15em);box-shadow:0 .1em 0 #2f7d70,0 0 0 1.2pt #21685c,0 .1em 0 1.2pt #21685c}
@keyframes endGlow{50%{box-shadow:0 .25em 0 #2f7d70,0 0 0 1.2pt #21685c,0 .25em 0 1.2pt #21685c,0 0 0 .45em rgba(127,209,193,.45)}}
#radar{position:absolute;top:3.3em;left:.8em;right:.8em;height:5.6em;z-index:5;display:none;background:rgba(9,36,44,.86);border-radius:.6em;box-shadow:0 .4em 1.2em rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#radar svg{width:100%;height:100%;display:block}
#radar .rlab{font:5.6px 'Jua',sans-serif}
#radar .rt{font:7.5px 'Share Tech Mono',monospace;fill:#5ef2dc;letter-spacing:.08em}
#radar .rs{font:6px 'Share Tech Mono',monospace;fill:#3fa59a}
#radar .rr{font:8px 'Jua',sans-serif;fill:#cdfaf3}
#radar .rm{font:6px 'Share Tech Mono',monospace;fill:#5ef2dc}
#radar .ro{font:6px 'Share Tech Mono',monospace;fill:#ff5470}
#radar.alert{box-shadow:0 0 0 .12em #ff5470,0 .4em 1.2em rgba(0,0,0,.25)}
#limit{position:absolute;top:3.4em;left:50%;transform:translateX(-50%);padding:.3em .8em;font-size:.85em;display:none;z-index:5;white-space:nowrap}
#press{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);width:68%;height:12%;border-radius:999px;
  display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:pointer;z-index:6;
  background:linear-gradient(180deg,#ffffffcc,#e8f6f2cc);border:.18em solid var(--mint);transition:transform .08s,background .2s,opacity .2s}
#press .t{font-size:1.45em}
#press .s{font-size:.78em;opacity:.7;margin-top:.15em}
#press.eating{transform:translateX(-50%) scale(.95);background:linear-gradient(180deg,#ffe3ec,#ffc9d9);border-color:var(--pink)}
#press.inertia{background:linear-gradient(180deg,#fff3bf,#ffe066);border-color:#fab005;animation:wob .12s infinite alternate}
#press.done,#press.count{opacity:.55}
@keyframes wob{from{transform:translateX(-51%)}to{transform:translateX(-49%)}}
#reactBar{position:absolute;right:3.5%;bottom:14.5%;display:none;flex-direction:column;gap:.35em;z-index:8}
#reactBar button{width:2.9em;border:none;cursor:pointer;border-radius:1.2em;padding:.25em 0 .2em;display:flex;flex-direction:column;align-items:center;font-size:1em;touch-action:manipulation}
#reactBar button .e{font-size:1.25em;line-height:1.1}
#reactBar button .n{font-family:'Share Tech Mono',monospace;font-size:.62em;color:var(--ink)}
#reactBar button.pop{animation:hit .25s ease-out}
#reactBar .sub{display:flex;flex-direction:column;gap:.35em;pointer-events:none}
#reactBar .sub button{opacity:0;transform:translateY(1.2em) scale(.6);transition:opacity .16s,transform .2s cubic-bezier(.3,1.6,.5,1)}
#reactBar.open .sub{pointer-events:auto}
#reactBar.open .sub button{opacity:1;transform:none}
#reactBar.open .sub button:nth-child(1){transition-delay:.12s}#reactBar.open .sub button:nth-child(2){transition-delay:.09s}#reactBar.open .sub button:nth-child(3){transition-delay:.06s}#reactBar.open .sub button:nth-child(4){transition-delay:.03s}
#reactBar .main{width:3.3em;height:3.3em;padding:0;justify-content:center;border-radius:50%}
#reactBar .main .e{font-size:1.6em}
#reactBar .main{position:relative;overflow:visible}
#reactBar .main .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:.25em;font-family:'Jua',sans-serif;font-size:.68em;white-space:nowrap;color:var(--ink);background:#ffffffcc;border-radius:.6em;padding:.05em .45em}
#reactBar.open .main{background:linear-gradient(180deg,#ffe3ec,#ffc9d9)}
#floatLayer{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.rbub{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:2;animation:rbIn .28s cubic-bezier(.2,1.6,.4,1) both}
.rbub span{display:block;background:#fff;border-radius:1em;padding:.14em .42em;font-size:1.45em;line-height:1.2;box-shadow:0 .2em .5em rgba(36,52,58,.18)}
.rbub::before{content:'';position:absolute;left:50%;bottom:-.36em;transform:translateX(-50%);border:.42em solid transparent;border-top-color:#fff;border-bottom:0;z-index:1}
.rbub.out{transition:opacity .3s;opacity:0}
@keyframes rbIn{0%{transform:translate(-50%,-100%) scale(.2)}100%{transform:translate(-50%,-100%) scale(1)}}
.bst{position:absolute;font-size:1.3em;transform:translate(-50%,-50%);animation:bst .9s cubic-bezier(.15,.9,.3,1) forwards}
@keyframes bst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
.bstc{position:absolute;font-size:2.6em;transform:translate(-50%,-50%);animation:bstc .7s ease-out forwards}
@keyframes bstc{0%{transform:translate(-50%,-50%) scale(.2)}35%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.flt{position:absolute;font-size:1.6em;animation:floatUp 1.8s ease-out forwards}
@keyframes floatUp{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:1;transform:translate(0,-.6em) scale(1.15)}100%{transform:translate(var(--dx),-9em) scale(.9);opacity:0}}
#lobbyUI{position:absolute;left:4%;right:4%;bottom:2.5%;display:none;gap:.5em;align-items:stretch;z-index:8}
#lbMain{flex:none;width:52%;font-size:1.02em;padding:.55em .5em}
#lbSide{display:flex;flex-direction:row;gap:.35em;width:36%}
#lbSide button{flex:1;font-family:'Jua',sans-serif;font-size:.8em;white-space:nowrap;border:none;cursor:pointer;color:var(--ink);padding:.45em .2em;line-height:1.2}
#lbSide button b{display:block;font-size:1.15em;font-weight:400}
#panel{position:absolute;left:7%;right:7%;top:50%;transform:translateY(-50%) scale(.96);padding:1.3em 1.2em 1.1em;z-index:10;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-height:86%;overflow:auto}
#panel.low{top:auto;bottom:2.5%;transform:none;max-height:57%}
#panel.low.show{transform:none}
#panel.low.tall{max-height:74%}
#panel.show{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
#panel h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:1.75em;line-height:1.2;margin:.1em 0 .3em;letter-spacing:-.01em}
#panel h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:1.35em;margin:.1em 0 .4em}
#panel .kicker{font-family:'Share Tech Mono',monospace;font-size:.78em;color:var(--mint-d);letter-spacing:.08em}
#panel p{margin:.35em 0;line-height:1.5;font-size:.95em}
#panel .warn{background:#fff3bf;border-radius:.6em;padding:.45em .7em;font-size:.88em;margin-top:.6em}
#panel .muted{opacity:.6;font-size:.8em}
.btns{display:flex;flex-direction:column;gap:.75em;margin-top:1em}
#panel:not(.rpt) .btns .btn{width:86%;align-self:center}
#panelDim{position:absolute;inset:0;z-index:9;display:none;background:rgba(36,52,58,.18);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#panelDim.show{display:block}
.btn{font-family:'Jua',sans-serif;font-size:1.05em;padding:.7em 1em;border-radius:.8em;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#5fc4b1,#3f9f8e);box-shadow:0 .25em 0 #2f7d70}
.btn:not(.sub){border:none;box-shadow:0 .25em 0 #2f7d70,0 0 0 1.2pt #21685c,0 .25em 0 1.2pt #21685c;text-shadow:.06em 0 0 #2f7d70,-.06em 0 0 #2f7d70,0 .06em 0 #2f7d70,0 -.06em 0 #2f7d70,.045em .045em 0 #2f7d70,-.045em .045em 0 #2f7d70,.045em -.045em 0 #2f7d70,-.045em -.045em 0 #2f7d70}
#endBtn:not(.off){border:none !important;text-shadow:.06em 0 0 #2f7d70,-.06em 0 0 #2f7d70,0 .06em 0 #2f7d70,0 -.06em 0 #2f7d70,.045em .045em 0 #2f7d70,-.045em .045em 0 #2f7d70,.045em -.045em 0 #2f7d70,-.045em -.045em 0 #2f7d70}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #2f7d70,0 0 0 1.2pt #21685c,0 .1em 0 1.2pt #21685c}
.btn.sub{background:#ffffffcc;color:var(--ink);box-shadow:0 .25em 0 #c9d9d5,0 0 0 1.2pt #a8bfb9,0 .25em 0 1.2pt #a8bfb9}
.btn.sub:active{box-shadow:0 .1em 0 #c9d9d5,0 0 0 1.2pt #a8bfb9,0 .1em 0 1.2pt #a8bfb9}
.report{font-family:'Share Tech Mono','Jua',monospace;font-size:.88em;border-top:1px dashed #9fb8b2;border-bottom:1px dashed #9fb8b2;padding:.5em 0;margin:.6em 0}
.report div{display:flex;justify-content:space-between;padding:.12em 0}
.report b{font-weight:400}
.big{font-family:'Share Tech Mono',monospace;font-size:2.4em;text-align:center;margin:.1em 0}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9;
  font-family:'Black Han Sans',sans-serif;font-size:5em;color:#fff;-webkit-text-stroke:.04em var(--ink);text-shadow:0 .06em 0 var(--ink)}
#count span{animation:pop .6s ease-out both}
@keyframes pop{0%{transform:scale(2.2);opacity:0}35%{transform:scale(.95);opacity:1}100%{transform:scale(1);opacity:.0}}
#measure{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);padding:.5em 1.1em .6em;text-align:center;z-index:7;display:none;min-width:62%}
#measure .lb{font-family:'Share Tech Mono',monospace;font-size:.72em;letter-spacing:.12em;color:#c92a4b}
#measure .num{font-family:'Share Tech Mono',monospace;font-size:2.6em;line-height:1.1}
#measure .num small{font-size:.45em;margin-left:.15em}
#measure.red .num{color:#e03131;animation:blink .3s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#stamp{position:absolute;left:50%;top:26%;z-index:8;pointer-events:none;display:none;text-align:center;
  border:.22em double currentColor;border-radius:.4em;padding:.35em .8em .45em;font-family:'Black Han Sans',sans-serif;
  background:rgba(255,255,255,.35);mix-blend-mode:multiply;max-width:88%}
#stamp .a{font-size:1.15em}
#stamp .b{font-size:1.75em;line-height:1.15;white-space:nowrap}
#stamp .c{font-family:'Jua',sans-serif;font-size:.85em;margin-top:.15em}
#stamp.show{display:block;animation:stampIn .38s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{0%{transform:translateX(-50%) rotate(-11deg) scale(2.8);opacity:0}100%{transform:translateX(-50%) rotate(-11deg) scale(1);opacity:.92}}
#toast{position:absolute;left:50%;top:9.9em;transform:translateX(-50%);padding:.45em .9em;z-index:11;font-size:.9em;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#crow{position:absolute;top:18%;left:-20%;width:3.2em;z-index:8;pointer-events:none;display:none}
#crow.fly{display:block;animation:fly 2.6s linear forwards}
@keyframes fly{0%{left:-20%;transform:translateY(0)}25%{transform:translateY(-.6em)}50%{transform:translateY(.4em)}75%{transform:translateY(-.5em)}100%{left:115%;transform:translateY(0)}}
#settings{position:absolute;top:3.6em;right:.8em;width:78%;padding:1em 1.1em;z-index:16;display:none;font-size:.95em;max-height:84%;overflow:auto}
#settings .srow{display:flex;justify-content:space-between;align-items:center;padding:.4em 0 .7em;border-bottom:1px dashed #c5ddd7}
.tgl{width:3.2em;height:1.7em;border-radius:999px;border:none;background:#c9d3d1;position:relative;cursor:pointer;transition:background .2s}
.tgl i{position:absolute;top:.2em;left:.2em;width:1.3em;height:1.3em;border-radius:50%;background:#fff;box-shadow:0 .1em .2em rgba(0,0,0,.2);transition:left .2s}
.tgl.on{background:#5fc4b1} .tgl.on i{left:1.7em}
#settings .sbtn{width:100%;margin-top:.8em;font-size:.95em;padding:.55em}
#settings .credit{margin-top:.9em;text-align:center;background:#ffffff99;border-radius:.8em;padding:.6em}
#settings .credit .ct{font-size:.8em;opacity:.65}
#settings .credit a{display:inline-block;margin-top:.2em;font-family:'Black Han Sans';font-size:1.15em;color:#c2255c;text-decoration:none}
#settings .credit .cs{font-size:.72em;opacity:.55;margin-top:.1em}
#settings details.dev{margin-top:.9em;font-size:.85em;opacity:.8}
#settings details.dev summary{cursor:pointer;color:#8a9a98}
#settings.show{display:block}
#setDim{position:absolute;inset:0;z-index:15;display:none}
#setDim.show{display:block}
#fsEd{position:absolute;left:.5em;right:.5em;top:.5em;z-index:40;display:none;background:#1f2a30ee;color:#fff;border-radius:.8em;padding:.6em .7em;font-family:'Jua',sans-serif;font-size:14px;line-height:1.3}
#fsEd.show{display:block}
#fsEd.bot{top:auto;bottom:.5em}
#fsEd .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3em}
#fsEd button{font-family:inherit;font-size:13px;border:none;border-radius:.5em;padding:.35em .6em;background:#3c4c53;color:#fff;cursor:pointer}
#fsEd .tip{font-size:12px;opacity:.7;margin:.2em 0}
#fsEd .sel{font-family:'Share Tech Mono',monospace;font-size:12px;color:#7ee0cf;word-break:break-all;margin:.2em 0}
#fsEd .ctl{display:flex;align-items:center;gap:.4em}

.fsHi{outline:2px dashed #ff4f8b !important;outline-offset:1px}
#settings h3{margin:0 0 .5em;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:1.15em}
#settings label{display:block;margin:.55em 0 .1em}
#settings .row{display:flex;justify-content:space-between}
#settings .v{font-family:'Share Tech Mono',monospace}
#settings input[type=range]{width:100%;accent-color:var(--mint-d)}
#settings select{width:100%;font-family:'Jua';font-size:1em;padding:.3em;border-radius:.4em;border:1px solid #bcd}

#title{position:absolute;inset:0;z-index:20;pointer-events:none;transition:opacity .6s}
#title.hide{opacity:0}

#title .t0{font-family:'Share Tech Mono',monospace;font-size:.82em;letter-spacing:.25em;color:#3f9f8e}

  text-shadow:0 .06em 0 #2f5d62,.05em .05em 0 #2f5d62,-.05em .05em 0 #2f5d62,.05em -.03em 0 #2f5d62,-.05em -.03em 0 #2f5d62,0 .2em .5em rgba(36,52,58,.25)}

<script type="module">
import * as THREE from 'three';

/* =========================================================
   설정 (프로토타입 조절용)
   ========================================================= */
const HOST_TIME=10; // 연구장 측정 제한 시간(초). 참가자는 roundTime(15초)
const DEFAULTS = { L:140, halfTime:3, inertia:0.3, perfect:2, chicken:30, hostMinLeft:10, roundTime:15, view:20, sound:'clear', shake:true };
let CFG = { ...DEFAULTS };
const CRUNCH_MM = 2.4;          // 몇 mm마다 '바삭' 한 번
const HOST_AUTO_START = 8;      // 방장이 이 시간까지 안 누르면 자동 처리
const CH_DEADLINE = 15;         // 도전자 제한 시간(누르기 시작 전)

const $ = s => document.querySelector(s);
const app = $('#app');

/* =========================================================
   먹기 계산 (해석적 — 프레임과 무관하게 정확)
   ========================================================= */
const speed = p => (p.L/2)/p.halfTime; // mm/s
// segs: [{tp,tr}] — 여러 번 누르기 지원 (관성 꼬리는 다음 누르기에서 끊김)
function eatenAt(t, segs, p){
  const V=speed(p), I=p.inertia; let e=0;
  for(let i=0;i<segs.length;i++){ const s=segs[i]; if(t<=s.tp) break;
    if(s.mm!=null){ e+=s.mm*Math.min(1,(t-s.tp)/(s.tr-s.tp)); continue; }
    const tr=s.tr==null?Infinity:s.tr; e+=V*(Math.min(t,tr)-s.tp);
    if(t>tr && I>0){ const next=segs[i+1]?segs[i+1].tp:Infinity; const dt=Math.min(t,next,tr+I)-tr; if(dt>0) e+=V*(dt-dt*dt/(2*I)); } }
  return e;
}
function rateAt(t, segs, p){
  const V=speed(p), I=p.inertia;
  for(let i=segs.length-1;i>=0;i--){ const s=segs[i]; if(t<s.tp) continue;
    if(s.mm!=null) return t<s.tr?s.mm/(s.tr-s.tp):0;
    if(s.tr==null||t<=s.tr) return V; const dt=t-s.tr; return (I>0&&dt<I)?V*(1-dt/I):0; }
  return 0;
}
const endOf=(segs,p)=>{ const l=segs[segs.length-1]; return l?l.tr+(l.mm!=null?0:p.inertia):0; };
const nudgeDur=mm=>mm>=3?.2:mm>=.5?.1:.05;   // 한 입 먹는 시간
const NUDGE_GAP=.05;                               // 다음 입까지 간격
const JIT={5:.045,1:.09,0.1:.18};                   // 한 입 양 흔들림(±비율)
const finalEaten=(segs,p)=>eatenAt(1e9,segs,p);

/* =========================================================
   오디오 (전부 합성음)
   ========================================================= */
const AC = { ctx:null, master:null, noise:null, hum:null };
function muteOf(k){ const o=store.get('pp_mute',0); return !!store.get('pp_mute_'+k,o); }
function initAudio(){
  if(AC.ctx){ if(AC.ctx.state!=='running') AC.ctx.resume(); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
  const ctx = AC.ctx = new Ctx();
  AC.master = ctx.createGain(); AC.master.gain.value=muteOf('sfx')?0:.9; AC.master.connect(ctx.destination); // 효과음
  AC.music = ctx.createGain(); AC.music.gain.value=muteOf('bgm')?0:1; AC.music.connect(ctx.destination); // 배경음
  const len = ctx.sampleRate; const buf = ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  AC.noise = buf;
  startBgm();
}
// 배경음: 로비 = 느긋한 마림바 + 비커 보글 / 측정 중 = 째깍째깍 긴장 피치카토
function startBgm(){
  const ctx=AC.ctx;
  const mk=v=>{ const g=ctx.createGain(); g.gain.value=v; g.connect(AC.music); return g; };
  const lob=mk(.16), gam=mk(0); AC.bgm=lob;
  const N=m=>440*Math.pow(2,(m-69)/12);
  function mar(bus,t,f,v,d){ [[1,v],[4,v*.18]].forEach(([k,vv])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*k;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vv,t+.006); g.gain.exponentialRampToValueAtTime(.0005,t+(k>1?.12:d));
    o.connect(g).connect(bus); o.start(t); o.stop(t+d+.05); }); }
  function blup(t){ const o=ctx.createOscillator(); o.type='sine'; const f=280+Math.random()*200;
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.6,t+.07);
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+.09);

  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(4+Math.random()*9)*W/400;

  timeHud(t,RT); eatHud(c); syncPress(S.ch,t,pc);

  const hostEnd=endOf(S.host.segs,p);

function finish(hCol,cCol){
  S.phase='reveal'; showPress(false); hideEndBtn(); hideHud(); charL.sweatLv=charR.sweatLv=0; charL.chew=charR.chew=0; S.close=null;
  const p=S.hostP, pc=S.chP; let hF,cF,gap;

  g.fillStyle=T.color; g.font="150px 'Share Tech Mono', monospace"; g.textAlign='right'; g.fillText(R.tier==='crash'?'0.00':fmt(Math.max(R.gap,.01)),W-170,y+50); g.font="64px 'Share Tech Mono'"; g.fillText('mm',W-80,y+74);
  g.textAlign='center'; g.fillStyle='#9aa8a5'; g.font="28px 'Share Tech Mono'"; g.fillText(`PEPERO PRECISION LAB · ${lab.n} 연구실 · since 11.11`,W/2,H-46);
  return c;
}
async function saveReport(R){
  toast('보고서 이미지 만드는 중…',1200);
  const c=await buildReportImage(R); const url=c.toDataURL('image/png'); const name=`빼빼로실험_${S.reportNo}.png`;
  try{ const blob=await (await fetch(url)).blob(); const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'실험 보고서'}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ const a=document.createElement('a'); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); }catch(e){}
  showShot(url);
}

async function shareReport(R){
  const lab=S.lab, txt=R.tier==='crash'?`[초정밀 빼빼로 길이 측정 연구소] ${lab.n} 연구실 빼빼로 실험 중 접촉 사고 발생…😳 너는 닿지 않고 버틸 수 있어?`:`[초정밀 빼빼로 길이 측정 연구소] ${lab.n} 연구실에서 빼빼로를 ${fmt(R.gap)}mm 남기고 멈췄다! 🍫 너는 더 가까이 갈 수 있어?`;
  if(navigator.share){ try{ await navigator.share({title:'초정밀 빼빼로 길이 측정 연구소',text:txt,url:location.href}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }

}

/* =========================================================
   메인 루프
   ========================================================= */
let lastNow=performance.now();
// 상단 레이더: 전체 빼빼로 + 내 위치. 상대 끝은 시야 안에 들어와야 탐지
(function(){ const g=document.getElementById('rGrid'); let h=''; for(let m=0;m<=140;m+=10){ const x=20+m/140*260; h+=`<line x1="${x}" x2="${x}" y1="${m%70===0?42:43}" y2="${m%70===0?47:45.5}" stroke="#3fa59a" stroke-width=".6"/>`; } g.innerHTML=h; })();
const RX=(m,L)=>20+Math.max(0,Math.min(L,m))/L*260;
function setRect(id,x1,x2){ const el=document.getElementById(id); if(x2-x1<=.01){ el.setAttribute('width',0); return; } el.setAttribute('x',x1); el.setAttribute('width',x2-x1); }
function updateRadar(time){
  const rd=$('#radar'); const on=!!S.close&&(S.phase==='hostPlay'||S.phase==='chPlay'||S.phase==='hostCount'||S.phase==='chCount');
  rd.style.display=on?'block':'none'; if(!on) return;
  const side=S.close.side, p=S.close.p, L=p.L; let h=0,c=0;
  const t=(S.phase==='hostPlay'||S.phase==='chPlay')?(performance.now()-S.t0)/1000:0;
  if(S.phase==='hostPlay'||S.phase==='hostCount'){ h=S.host?eatenAt(t,S.host.segs,S.hostP):0; }
  else { h=eatenAt(t,S.host.segs,S.hostP); c=eatenAt(t,S.ch.segs,S.chP); }
  const isHost=S.phase==='hostPlay'||S.phase==='hostCount';
  const gap=L-h-c, seen=!isHost&&gap<=p.view;
  { const myC=side==='R'?charR:charL, opC=side==='R'?charL:charR, mine=side==='R'?c:h;
    const near=seen?Math.min(1,Math.max(0,1-gap/p.view))*.7+.3:0, deep=Math.min(1,Math.max(0,(mine-45)/45))*.45;
    myC.sweatLv=Math.max(near,deep); opC.sweatLv=seen?near:0; }
  const me=side==='R'?L-c:h, op=side==='R'?h:L-c, myEat=side==='R'?c:h;
  const dir=side==='R'?-1:1; const scanTo=me+dir*p.view;
  if(side==='R'){ setRect('rEatMe',RX(me,L),RX(L,L)); }
  else { setRect('rEatMe',RX(0,L),RX(me,L)); }
  if(seen){ setRect('rUnknown',0,0);
    if(side==='R'){ setRect('rStick',RX(op,L),RX(me,L)); setRect('rEatOp',RX(0,L),RX(op,L)); } else { setRect('rStick',RX(me,L),RX(op,L)); setRect('rEatOp',RX(op,L),RX(L,L)); }
  } else { setRect('rEatOp',0,0);
    if(side==='R'){ setRect('rStick',RX(scanTo,L),RX(me,L)); setRect('rUnknown',RX(0,L),RX(scanTo,L)); } else { setRect('rStick',RX(me,L),RX(scanTo,L)); setRect('rUnknown',RX(scanTo,L),RX(L,L)); } }
  const ua=side==='R'?[RX(0,L),RX(scanTo,L)]:[RX(scanTo,L),RX(L,L)]; const sw=document.getElementById('rSweep');
  if(!seen&&ua[1]-ua[0]>24){ const k=(time*.55)%1; const x=side==='R'?ua[1]-22-k*(ua[1]-ua[0]-22):ua[0]+k*(ua[1]-ua[0]-22); sw.setAttribute('x',x); sw.setAttribute('width',22); sw.setAttribute('transform',side==='R'?`rotate(180 ${x+11} 35)`:''); } else sw.setAttribute('width',0);
  const lab=(id,x1,x2,min=22)=>{ const el=document.getElementById(id); if(x2-x1<min){ el.style.display='none'; return; } el.style.display=''; el.setAttribute('x',(x1+x2)/2); };
  const eatA=side==='R'?[RX(me,L),RX(L,L)]:[RX(0,L),RX(me,L)];
  const seeA=seen?(side==='R'?[RX(op,L),RX(me,L)]:[RX(me,L),RX(op,L)]):(side==='R'?[RX(scanTo,L),RX(me,L)]:[RX(me,L),RX(scanTo,L)]);
  lab('rEatTxt',eatA[0],eatA[1]); lab('rSeeTxt',seeA[0],seeA[1],16); if(seen) document.getElementById('rUnkTxt').style.display='none'; else { lab('rUnkTxt',ua[0],ua[1],34); document.getElementById('rUnkTxt').textContent=isHost?'참가자 구역':'? 미확인 ?'; }
  document.getElementById('rMe').setAttribute('transform',`translate(${RX(me,L)} 22)`);
  const rOp=document.getElementById('rOp'); rOp.style.display=seen?'':'none'; rOp.setAttribute('transform',`translate(${RX(op,L)} 22)`);
  $('#rL').textContent=`내 섭취 ${fmt(myEat)}mm`;
  $('#rR').textContent=isHost?`남은 길이 ${fmt(Math.max(0,L-h))}mm · 최소 ${p.hostMinLeft}mm`:seen?`⚠ 상대 감지 · 거리 ${fmt(Math.max(0,gap))}mm`:'상대 위치: 탐지 불가';
  $('#rR').style.fill=seen?'#ff8fa3':'#7fbfb8'; rd.classList.toggle('alert',seen);
  if(seen&&!S.seenOnce){ S.seenOnce=true; sfx.beep(1760,.08,.08); setTimeout(()=>sfx.beep(1760,.08,.08),120); }
}
function syncPress(r,t,p){
  const L=r.segs[r.segs.length-1], pressing=L&&L.tr==null, sliding=!pressing&&L&&L.mm==null&&rateAt(t,r.segs,p)>0;
  const nib=L&&L.mm!=null&&t<L.tr;
  if(pressing) setPress('eating'); else if(nib) setPress('nibble'); else if(sliding) setPress('inertia'); else setPress(r.ended||r.locked?'done':'ready');
}
function hideLabels(h){ charL.root.userData.lab.visible=charR.root.userData.lab.visible=!h; }
function timeHud(t,RT){ const el=$('#timer'), rem=Math.max(0,RT-t); el.style.visibility='visible'; el.textContent=`⏳ ${fmt(rem)}s`; el.classList.toggle('urgent',rem<=3&&rem>0); }
function eatHud(e){}
function hideHud(){ $('#timer').style.visibility='hidden'; $('#timer').classList.remove('urgent'); $('#limit').style.display='none'; $('#eat').style.display='none'; $('#radar').style.display='none'; }
function showEndBtn(label,fn){ const b=$('#endBtn'); b.textContent=label; b.style.display='block'; b.classList.remove('off'); $('#nudges').classList.remove('off'); b.onclick=()=>{ if(b.classList.contains('off')) return; sfx.click(); fn(); }; }
function offEndBtn(){ const b=$('#endBtn'); b.classList.add('off'); b.textContent='측정 완료'; $('#nudges').classList.add('off'); }
function hideEndBtn(){ $('#endBtn').style.display='none'; $('#endBtn').classList.remove('off'); $('#nudges').classList.remove('off'); }
function loop(now){
  requestAnimationFrame(loop);
  const rawMs=now-lastNow;
  if(PAUSED){ lastNow=now; S.t0+=rawMs; tweens.forEach(tw=>tw.s+=rawMs); renderer.render(scene,camera); return; }
  const dt=Math.min((now-lastNow)/1000,.05); lastNow=now; const time=now/1000;
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; const p=Math.min(1,(now-tw.s)/tw.dur); tw.fn(p); if(p>=1){ tweens.splice(i,1); tw.res(); } }
  if(S.phase==='hostPlay') stepHost((now-S.t0)/1000);
  else if(S.phase==='chPlay'){
    // 연구원이 멈춘 뒤엔 남은 연구장 기록을 빨리 감기 (순간이동 없이 약 1초 안에 마무리)
    const t=(now-S.t0)/1000;
    if(S.ch.ended && !S.collided){ const chE=S.ch.segs.length?endOf(S.ch.segs,S.chP):0;
      if(t>chE+.15){ const rem=endOf(S.host.segs,S.hostP)+.4-t; const k=Math.max(1,Math.min(12,rem/1.0)); if(k>1.5&&!S.ffShown){ S.ffShown=true; toast('⏩ 연구장 기록 재생 중',1200); } S.t0-=dt*1000*(k-1); } }
    stepCh((now-S.t0)/1000); }
  if(S.close && (S.phase==='hostPlay'||S.phase==='chPlay')){ const v=closeView(); camT.lerp(v.T,Math.min(1,dt*8)); camD=v.D; camDir.copy(v.dir); applyCam(); }
  camKickV*=Math.pow(.01,dt); if(camKickV>.01 && S.close){ camera.position.x+=Math.sin(time*90)*camD*.004*camKickV; camera.position.y+=Math.cos(time*77)*camD*.003*camKickV; }
  // 캐릭터 애니메이션
  blink(charL,dt); blink(charR,dt);
  for(const ch of [charL,charR]){
    const chewing=ch.chew>0;
    ch.head.position.y=(ch.head.userData.baseY??7.9)+(chewing?Math.abs(Math.sin(time*24))*.13:Math.sin(time*1.6+ch.facing)*.04);
    ch.snout.scale.y=.75*(chewing?1+Math.sin(time*48)*.07:1);
    if(!S.kissing) ch.head.rotation.z=(S.phase==='chPlay'&&ch===charL)?Math.sin(time*1.3)*.05:Math.sin(time*.9+ch.facing)*.02;
    const lv=ch.sweatLv||0; if(lv>.03&&!ch.sweatForce) ch.sweat.visible=true; else if(!ch.sweatForce) ch.sweat.visible=false;
    if(ch.sweat.visible){ const L=ch.sweatForce?1:lv, n=Math.max(1,Math.ceil(L*6)); ch.sweat.children.forEach((d,i)=>{ d.visible=i<n; const k=((time*(.7+L*1.6)+d.userData.ph)%1); d.position.y=d.userData.y0-k*1.4; d.scale.setScalar((.45+L*.45)*(1-k*.5)); }); }
  }
  if(S.repeat&&(S.phase==='hostPlay'||S.phase==='chPlay')){ const r=curRec(); if(r&&!r.ended&&!r.locked&&nowT()>=(r.busy||0)) nudge(S.repeat.mm,true); }
  ruler.visible=!!S.close; if(lobby.visible) stepAvatars(dt,time); stepCrumbs(dt);
  updateRadar(time);
  // 블라인드 흔들림
  blindKickV*=Math.pow(.02,dt); blind.position.x=BX+Math.sin(time*70)*.09*blindKickV; blind.rotation.z=Math.sin(time*53)*.006*blindKickV;
  // 사이렌 조명 & 측정기 LED
  sirenLight.intensity=S.sirenOn?(Math.sin(time*14)*.5+.5)*900:0;
  devLed.material.color.set(Math.sin(time*6)>0?'#ff2b4a':'#5c1a24');
  hand2.rotation.z=-time*.5;
  renderer.render(scene,camera);
  if(parts.length) stepFx(); else if(fxC._dirty!==false){ fxG.clearRect(0,0,fxC.width,fxC.height); fxC._dirty=false; }
  if(parts.length) fxC._dirty=true;
}
